<!DOCTYPE html><html><head><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 1920px; height: 1080px;
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(135deg, #040B1A 0%, #071A35 40%, #0A1628 100%);
    color: #E2E8F0;
    overflow: hidden;
    position: relative;
}

body::before {
    content: '';
    position: absolute; inset: 0;
    background:
        radial-gradient(ellipse 600px 400px at 15% 20%, rgba(14,165,233,0.07), transparent),
        radial-gradient(ellipse 500px 350px at 85% 75%, rgba(34,211,238,0.05), transparent),
        radial-gradient(ellipse 400px 300px at 50% 50%, rgba(34,197,94,0.03), transparent);
    pointer-events: none;
}

.grid-overlay {
    position: absolute; inset: 0;
    background-image:
        linear-gradient(rgba(14,165,233,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,165,233,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
}

.glass-card {
    background: rgba(14, 165, 233, 0.06);
    border: 1px solid rgba(14, 165, 233, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 32px;
    transition: all 0.3s;
}

.glass-card-green {
    background: rgba(34, 197, 94, 0.06);
    border: 1px solid rgba(34, 197, 94, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    padding: 32px;
}

.glow-text {
    text-shadow: 0 0 40px rgba(14,165,233,0.3);
}

.accent { color: #0EA5E9; }
.cyan { color: #22D3EE; }
.green { color: #22C55E; }
.gold { color: #FACC15; }
.muted { color: #94A3B8; }

.tag {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.container { padding: 80px 120px; position: relative; z-index: 1; }
h1 { font-size: 52px; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #0EA5E9, #22D3EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 18px; color: #64748B; margin-bottom: 60px; }
.cards { display: flex; gap: 40px; justify-content: center; }
.member-card { flex: 1; max-width: 420px; text-align: center; padding: 48px 36px; }
.avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #0EA5E9, #22D3EE); display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; font-size: 36px; font-weight: 800; color: #071A35; }
.member-name { font-size: 28px; font-weight: 700; color: #F1F5F9; margin-bottom: 20px; }
.info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(14,165,233,0.1); }
.info-row:last-child { border-bottom: none; }
.info-label { font-size: 14px; color: #64748B; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
.info-value { font-size: 16px; color: #CBD5E1; font-weight: 500; }
</style></head><body>
<div class="grid-overlay"></div>
<div class="container">
    <h1 class="glow-text">Project Team</h1>
    <p class="subtitle">The engineers behind StockSense</p>
    <div class="cards">
        <div class="glass-card member-card">
            <div class="avatar">RP</div>
            <div class="member-name">Rohan Patel</div>
            <div class="info-row"><span class="info-label">Enrollment</span><span class="info-value">24002171210122</span></div>
            <div class="info-row"><span class="info-label">Roll No</span><span class="info-value">38</span></div>
        </div>
        <div class="glass-card member-card">
            <div class="avatar">PP</div>
            <div class="member-name">Pranshu Patel</div>
            <div class="info-row"><span class="info-label">Enrollment</span><span class="info-value">24002171210128</span></div>
            <div class="info-row"><span class="info-label">Roll No</span><span class="info-value">56</span></div>
        </div>
        <div class="glass-card member-card">
            <div class="avatar">HP</div>
            <div class="member-name">Himanshu Patel</div>
            <div class="info-row"><span class="info-label">Enrollment</span><span class="info-value">24002171210117</span></div>
            <div class="info-row"><span class="info-label">Roll No</span><span class="info-value">39</span></div>
        </div>
    </div>
</div>
</body></html>
