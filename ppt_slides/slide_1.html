<!DOCTYPE html><html><head><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 1920px; height: 1080px;
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(135deg, #040B1A 0%, #071A35 40%, #0A1628 100%);
    color: #E2E8F0;
    overflow: hidden;
    position: relative;
}

body::before {
    content: '';
    position: absolute; inset: 0;
    background:
        radial-gradient(ellipse 600px 400px at 15% 20%, rgba(14,165,233,0.07), transparent),
        radial-gradient(ellipse 500px 350px at 85% 75%, rgba(34,211,238,0.05), transparent),
        radial-gradient(ellipse 400px 300px at 50% 50%, rgba(34,197,94,0.03), transparent);
    pointer-events: none;
}

.grid-overlay {
    position: absolute; inset: 0;
    background-image:
        linear-gradient(rgba(14,165,233,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,165,233,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
}

.glass-card {
    background: rgba(14, 165, 233, 0.06);
    border: 1px solid rgba(14, 165, 233, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 32px;
    transition: all 0.3s;
}

.glass-card-green {
    background: rgba(34, 197, 94, 0.06);
    border: 1px solid rgba(34, 197, 94, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    padding: 32px;
}

.glow-text {
    text-shadow: 0 0 40px rgba(14,165,233,0.3);
}

.accent { color: #0EA5E9; }
.cyan { color: #22D3EE; }
.green { color: #22C55E; }
.gold { color: #FACC15; }
.muted { color: #94A3B8; }

.tag {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.hero { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
.hero-title { font-size: 120px; font-weight: 900; letter-spacing: -3px; background: linear-gradient(135deg, #0EA5E9, #22D3EE, #22C55E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px; }
.hero-subtitle { font-size: 34px; font-weight: 400; color: #94A3B8; max-width: 800px; line-height: 1.5; }
.hero-tag { margin-bottom: 36px; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: 0; }
.orb-1 { width: 500px; height: 500px; background: #0EA5E9; top: -100px; left: -100px; }
.orb-2 { width: 400px; height: 400px; background: #22C55E; bottom: -50px; right: -50px; }
.orb-3 { width: 300px; height: 300px; background: #22D3EE; top: 50%; left: 60%; }
.bottom-bar { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; gap: 60px; }
.bottom-bar span { font-size: 14px; color: #475569; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; }
</style></head><body>
<div class="grid-overlay"></div>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
<div class="hero">
    <div class="hero-tag"><span class="tag" style="background:rgba(14,165,233,0.15);color:#0EA5E9;">University Project 2026</span></div>
    <h1 class="hero-title glow-text">StockSense</h1>
    <p class="hero-subtitle">AI-Powered Stock Market Analysis<br>&amp; Paper Trading Platform</p>
</div>
<div class="bottom-bar">
    <span>React</span><span>Django</span><span>PostgreSQL</span><span>AI / LLM</span><span>Yahoo Finance</span>
</div>
</body></html>
